---
- name: Get VMware Snapshots Older Than 7 Days and Send Email
  hosts: localhost
  gather_facts: false

  vars:
    datacenter: "YOUR_DATACENTER"          # Set or pass via extra_vars
    env: "production"                      # Environment name
    helper: "#"                            # URL for "Prompt on Launch"

    smtp_server: "your-smtp-server"
    smtp_port: 25
    email_from: "ansible@yourdomain.com"
    email_to: "recipient@domain.com"

    current_date: "{{ now(utc=false, fmt='%Y-%m-%d') }}"

  tasks:
    - name: Gather all VMware snapshots
      community.vmware.vmware_all_snapshots_info:
        datacenter: "{{ datacenter }}"
        validate_certs: false
      delegate_to: localhost
      register: snapshots_result

    - name: Get cutoff date (UTC) 7 days ago
      ansible.builtin.command: date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%S
      register: cutoff_cmd
      changed_when: false

    - name: Set cutoff date fact
      ansible.builtin.set_fact:
        cutoff_7d_ago: "{{ cutoff_cmd.stdout }}"

    - name: Filter snapshots older than 7 days
      ansible.builtin.set_fact:
        old_snapshots: >-
          {{
            snapshots_result.vmware_all_snapshots_info | default([])
            | selectattr('creation_time', 'defined')
            | selectattr('creation_time', '<', cutoff_7d_ago)
            | list
          }}

    - name: Show snapshots found
      ansible.builtin.debug:
        msg: "Found {{ old_snapshots | length }} snapshots older than 7 days"

    - name: Build list of VMs with old snapshots
      ansible.builtin.set_fact:
        vms_with_snaps: >-
          {{
            old_snapshots
            | map(attribute='vm_name')
            | list
            | unique
          }}

    - name: Initialize VM folder map
      ansible.builtin.set_fact:
        vm_folder_map: {}

    - name: Get VM folder information
      community.vmware.vmware_vm_info:
        validate_certs: false
        vm_name: "{{ item }}"
        show_folder: true
      loop: "{{ vms_with_snaps }}"
      delegate_to: localhost
      register: vm_info_per_vm

    - name: Build VM name to folder map
      ansible.builtin.set_fact:
        vm_folder_map: >-
          {{
            vm_folder_map
            | combine(
                {
                  item.invocation.module_args.vm_name:
                    (
                      item.virtual_machines | default([]) | first | default({})
                    ).folder | default('N/A')
                }
              )
          }}
      loop: "{{ vm_info_per_vm.results }}"
      loop_control:
        label: "{{ item.invocation.module_args.vm_name }}"

    - name: Send email with old snapshots report
      community.general.mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        from: "{{ email_from }}"
        to: "{{ email_to }}"
        subject: "VMware Snapshots Older Than 7 Days Report - {{ current_date }} - {{ env }}"
        subtype: html
        body: |
          <html>
            <script>
            function copyHref(event) {
              // Prevent the browser from opening the link
              event.preventDefault(); 
              
              // Get the href attribute value from the clicked link
              const linkUrl = event.target.getAttribute('href'); 
              
              // Copy the URL string to the clipboard
              navigator.clipboard.writeText(linkUrl)
                .then(() => {
                  alert("Link copied to clipboard!");
                })
                .catch(err => {
                  console.error("Failed to copy link: ", err);
                });
            }
            </script>
          <body>

          <h2>VMware Snapshots Older Than 7 Days Report - {{ env }}</h2>

          <p>
          Total snapshots older than 7 days:
          <strong>{{ old_snapshots | length }}</strong>
          </p>

          <table border="1" cellpadding="5" cellspacing="0">
            <tr style="background-color:#d9d9d9;">
              <th>VM Folder</th>
              <th>VM Name</th>
              <th>Created Date</th>
              <th>Description</th>
              <th>Automation</th>
            </tr>

            {% for snap in old_snapshots %}
            <tr>
            <td><a href="#" onclick="copyHref(event)">{{ vm_folder_map.get(snap.vm_name, '#') }}</a></td>
              <td>{{ snap.vm_name }}</td>
              <td>{{ snap.creation_time }}</td>
              <td>{{ snap.description | default('No description') }}</td>
              <td>
                <a href="{{ helper }}">Prompt on Launch</a>
              </td>
            </tr>
            {% endfor %}

          </table>

          </body>
          </html>
      when: old_snapshots | length > 0
