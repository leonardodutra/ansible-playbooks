---
- name: Get VMware Snapshots and Send Email
  hosts: localhost
  gather_facts: false

  vars:
    datacenter: "YOUR_DATACENTER"          # set or pass via extra_vars
    env: "production"                      # set your environment name
    helper: "#"                            # URL for 'Prompt on Launch' link

    smtp_server: "your-smtp-server"
    smtp_port: 25
    email_from: "ansible@yourdomain.com"
    email_to: "recipient@domain.com"
    current_date: "{{ now(utc=false, fmt='%Y-%m-%d') }}"
    report_file: "/tmp/snapshots.html"

  tasks:
    - name: Gather all VMware snapshots
      community.vmware.vmware_all_snapshots_info:
        datacenter: "{{ datacenter }}"
        validate_certs: false
      delegate_to: localhost
      register: snapshots_result

    # Get current UTC time as ISO8601 string
    - name: Set current UTC datetime string
      set_fact:
        now_utc_str: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%S') }}"

    # Extract date-only part (YYYY-MM-DD) and compute "7 days ago" date by simple arithmetic
    # This works because ISO dates compare lexicographically in order.[web:18]
    - name: Build list of allowed dates (last 7 days, UTC)
      set_fact:
        allowed_dates: >-
          {{
            [
              (now_utc_str[0:10]),
              (now_utc_str[0:10] | to_datetime('%Y-%m-%d') | community.general.timedelta(days=-1) | strftime('%Y-%m-%d')),
              (now_utc_str[0:10] | to_datetime('%Y-%m-%d') | community.general.timedelta(days=-2) | strftime('%Y-%m-%d')),
              (now_utc_str[0:10] | to_datetime('%Y-%m-%d') | community.general.timedelta(days=-3) | strftime('%Y-%m-%d')),
              (now_utc_str[0:10] | to_datetime('%Y-%m-%d') | community.general.timedelta(days=-4) | strftime('%Y-%m-%d')),
              (now_utc_str[0:10] | to_datetime('%Y-%m-%d') | community.general.timedelta(days=-5) | strftime('%Y-%m-%d')),
              (now_utc_str[0:10] | to_datetime('%Y-%m-%d') | community.general.timedelta(days=-6) | strftime('%Y-%m-%d'))
            ]
          }}
      vars:
        # community.general.timedelta comes from the community.general collection.[web:3][web:1]
        _dummy: ""

    # Filter snapshots whose creation_time date (first 10 chars) is in allowed_dates
    - name: Filter snapshots from last 7 days
      set_fact:
        recent_snapshots: >-
          {{
            snapshots_result.vmware_all_snapshots_info | default([])
            | selectattr('creation_time', 'defined')
            | selectattr(
                'creation_time',
                'in',
                allowed_dates | map('regex_replace', '^(.*)$', '\\g<1>')
              )
            | selectattr(
                'creation_time',
                'match',
                '^(' ~ (allowed_dates | join('|')) ~ ')'
              )
            | list
          }}

    - name: Show snapshots found (last 7 days)
      debug:
        msg: "Found {{ recent_snapshots | length }} snapshots in the last 7 days"

    - name: Build list of VMs with snapshots (last 7 days)
      set_fact:
        vms_with_snaps: >-
          {{
            recent_snapshots
            | map(attribute='vm_name')
            | list
            | unique
          }}

    - name: Init vm_folder_map
      set_fact:
        vm_folder_map: {}

    - name: Get VM info (folder) per VM
      community.vmware.vmware_vm_info:
        validate_certs: false
        vm_name: "{{ item }}"
        show_folder: true
      loop: "{{ vms_with_snaps }}"
      delegate_to: localhost
      register: vm_info_per_vm

    - name: Build vm_name -> folder map from vm_info_per_vm
      set_fact:
        vm_folder_map: >-
          {{
            vm_folder_map
            | combine(
                {
                  item.invocation.module_args.vm_name:
                    (
                      item.virtual_machines | default([]) | first | default({})
                    ).folder | default('N/A')
                }
              )
          }}
      loop: "{{ vm_info_per_vm.results }}"
      loop_control:
        label: "{{ item.invocation.module_args.vm_name }}"

    - name: Send email with snapshots list (last 7 days)
      community.general.mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        from: "{{ email_from }}"
        to: "{{ email_to }}"
        subject: "VMware Snapshots Report - {{ current_date }}"
        subtype: html
        body: |
          <html>
          <body>
          <h2>VMware Snapshots Report - {{ env }}</h2>
          <p>Total snapshots (last 7 days): {{ recent_snapshots | length }}</p>
          <table border="1" cellpadding="5">
            <tr>
              <th>VM Folder</th>
              <th>VM Name</th>
              <th>Created Date</th>
              <th>Description</th>
              <th>Automation</th>
            </tr>
            {% for snap in recent_snapshots %}
            <tr>
              <td>{{ vm_folder_map[snap.vm_name] | default('N/A') }}</td>
              <td>{{ snap.vm_name }}</td>
              <td>{{ snap.creation_time }}</td>
              <td>{{ snap.description }}</td>
              <td><a href="{{ helper }}">Prompt on Launch</a></td>
            </tr>
            {% endfor %}
          </table>
          </body>
          </html>
      when:
        - recent_snapshots | length > 0
