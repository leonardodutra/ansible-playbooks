---
- name: Get VMware Snapshots and Send Email
  hosts: localhost
  gather_facts: false

  vars:  
    smtp_server: "your-smtp-server"
    smtp_port: 25
    email_from: "ansible@yourdomain.com"
    email_to: "recipient@domain.com"
    current_date: "{{ now(utc=False, fmt='%Y-%m-%d') }}"
    report_file: "/tmp/snapshots.html"

  tasks:
    - name: Gather all VMware snapshots
      community.vmware.vmware_all_snapshots_info:
        datacenter: "{{ datacenter }}"
        validate_certs: false
      delegate_to: localhost
      register: snapshots_result

    - name: Show snapshots found
      debug:
        msg: "Found {{ snapshots_result.vmware_all_snapshots_info | length }} snapshots"

    - name: Build list of VMs with snapshots
      set_fact:
        vms_with_snaps: >-
          {{
            snapshots_result.vmware_all_snapshots_info
            | map(attribute='vm_name')
            | list
            | unique
          }}

    - name: Init vm_folder_map
      set_fact:
        vm_folder_map: {}

    - name: Get VM info (folder) per VM
      community.vmware.vmware_vm_info:
        validate_certs: false
        vm_name: "{{ item }}"
        show_folder: true
      loop: "{{ vms_with_snaps }}"
      delegate_to: localhost
      register: vm_info_per_vm

    - name: Build vm_name -> folder map from vm_info_per_vm
      set_fact:
        vm_folder_map: >-
          {{
            vm_folder_map
            | combine(
                {
                  item.invocation.module_args.vm_name:
                  (
                    item.virtual_machines | default([]) | first | default({})
                  ).folder | default('N/A')
                }
              )
          }}
      loop: "{{ vm_info_per_vm.results }}"
      loop_control:
        label: "{{ item.invocation.module_args.vm_name }}"

    - name: Send email with snapshots list
      community.general.mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        from: "{{ email_from }}"
        to: "{{ email_to }}"
        subject: "VMware Snapshots Report - {{ current_date }}"
        subtype: html
        body: |
          <html>
          <body>
          <h2>VMware Snapshots Report - {{ env }}</h2>
          <p>Total snapshots: {{ snapshots_result.vmware_all_snapshots_info | length }}</p>
          <table border="1" cellpadding="5">
            <tr>
              <th>VM Folder</th>
              <th>VM Name</th>
              <th>Created Date</th>
              <th>Description</th>
              <th>Automation</th>
            </tr>
            {% for snap in snapshots_result.vmware_all_snapshots_info %}
            <tr>
              <td>{{ vm_folder_map[snap.vm_name] | default('N/A') }}</td>
              <td>{{ snap.vm_name }}</td>
              <td>{{ snap.creation_time }}</td>
              <td>{{ snap.description }}</td>
              <td><a href={{ helper }}>Prompt on Launch</a></td>
            </tr>
            {% endfor %}
          </table>
          </body>
          </html>
           when:
      when:
        - snapshots_result.vmware_all_snapshots_info | length > 0
