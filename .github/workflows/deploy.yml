name: Build and Push AWX Custom EE

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - requirements.txt
      - execution-environment.yml
      - context/**
      - EE/**
      - ansible.cfg
      - requirements/**
jobs:
  build_job:
    runs-on: self-hosted
    env:
      CI_REGISTRY_IMAGE: quay.io/suporteenergisa/awx-custom-ee
      CI_COMMIT_REF_SLUG: 1.0.0-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt-get install python3 python3-pip gcc musl-dev python3-dev python3-venv -y
          python3 -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      - name: Install docsible
        run: pip install docsible

      - name: Generate README.md with docsible
        run: |
          docsible --role ./ --playbook ./check_snapshot.yaml --no-backup

      - name: Build image
        run: |
          . venv/bin/activate
          ansible-builder build --tag="${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}" --container-runtime=docker --verbosity=3
        shell: bash

      - name: Login to Quay
        run: |
          echo ${{ secrets.SECRET }} | docker login quay.io -u ${{ secrets.LOGIN }} --password-stdin
        shell: bash

      - name: Push image
        run: |
          docker push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
        shell: bash

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
