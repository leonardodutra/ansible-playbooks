name: Build and Push AWX Custom EE

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - requirements.txt
      - execution-environment.yml
      - context/**
      - EE/**
      - ansible.cfg
      - requirements/**
jobs:
  build_job:
    runs-on: self-hosted
    env:
      CI_REGISTRY_IMAGE: quay.io/suporteenergisa/awx-custom-ee
      CI_COMMIT_REF_SLUG: 1.0.0-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt-get install python3 python3-pip gcc musl-dev python3-dev python3-venv -y
          python3 -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      - name: Generate documentation
        run: |
          ansible-docgen

      - name: Commit and push README.md if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --staged --quiet || (git commit -m "docs: update README.md via ansible-docgen" && git push)

      - name: Build image
        run: |
          . venv/bin/activate
          ansible-builder build --tag="${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}" --container-runtime=docker --verbosity=3
        shell: bash

      - name: Login to Quay
        run: |
          echo "${{ secrets.SECRET }}" | docker login quay.io -u "${{ secrets.LOGIN }}" --password-stdin
        shell: bash

      - name: Push image
        run: |
          docker push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
        shell: bash

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
